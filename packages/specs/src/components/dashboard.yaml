type: object
properties:
  id:
    description: Unique identifier for the dashboard.
    example: 0cf0e03d-4364-45df-b77b-ca61f61869d2
    type: string
  name:
    description: Name of the dashboard.
    example: My Dashboard
    type: string
  icon:
    description: Icon of the dashboard.
    example: dashboard
    type: string
    nullable: true
  note:
    description: Note of the dashboard.
    example: A dashboard for monitoring metrics.
    type: string
    nullable: true
  color:
    description: Color of the dashboard.
    example: '#00ff00'
    type: string
    nullable: true
